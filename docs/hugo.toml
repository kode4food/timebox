baseURL = "https://kode4food.github.io/timebox/"
locale = "en-us"
title = "Timebox"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "catppuccin-macchiato"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "logo.png"
    target = "static/img/logo.png"
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[params]
  BookTheme = "timebox-auto"
  BookSearch = true
  BookToC = true
  BookLogo = "img/logo.png"
  BookRepo = "https://github.com/kode4food/timebox"
  BookEditPath = "edit/main/docs/content"
